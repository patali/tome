<!DOCTYPE html>
<html lang="en" data-device="scribe">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tome — Reader</title>
<link rel="icon" type="image/png" href="icons/icon48.png">
<!-- Fonts are bundled (fonts/), not fetched: the reader works offline and
     opening a preview doesn't tell a third party what you're reading. -->
<link rel="stylesheet" href="fonts.css">

<!-- reader.js rewrites this so Cmd+P -> Save as PDF uses the real device page size. -->
<style id="tome-page-style">
@page { size: 157mm 210mm; margin: 10mm 10mm 10mm 10mm; }
</style>

<!-- Single source of truth for all e-ink typography (shared with the server's
     PDF renderer — see reader.css header). -->
<link rel="stylesheet" href="reader.css">
</head>
<body>

<nav id="tome-toolbar" aria-label="Preview controls" data-collapsed="false">
  <button id="tome-toggle" aria-expanded="true" aria-controls="tome-panel"
          title="Hide controls">›</button>
  <div id="tome-panel">
    <div class="tome-group">
      <span class="tome-label">Device</span>
      <div class="tome-row">
        <button data-device="scribe" aria-pressed="true">Scribe 10.2"</button>
        <button data-device="scribe3" aria-pressed="false">Scribe 11"</button>
        <button data-device="paperwhite" aria-pressed="false">Paperwhite</button>
      </div>
    </div>
    <div class="tome-group">
      <span class="tome-label">Images</span>
      <div class="tome-row">
        <button data-color="bw" aria-pressed="true">B&amp;W</button>
        <button data-color="color" aria-pressed="false">Colour</button>
      </div>
    </div>
    <div class="tome-group">
      <span class="tome-label">Reading font</span>
      <button data-font="literata" aria-pressed="true"
              style="font-family:'Literata',Georgia,serif">Literata</button>
      <button data-font="sourceserif" aria-pressed="false"
              style="font-family:'Source Serif 4',Georgia,serif">Source Serif 4</button>
      <button data-font="merriweather" aria-pressed="false"
              style="font-family:'Merriweather',Georgia,serif">Merriweather</button>
      <button data-font="baskerville" aria-pressed="false"
              style="font-family:'Libre Baskerville',Georgia,serif">Libre Baskerville</button>
      <button data-font="inter" aria-pressed="false"
              style="font-family:'Inter',ui-sans-serif,sans-serif">Inter</button>
      <button data-font="atkinson" aria-pressed="false"
              style="font-family:'Atkinson Hyperlegible',ui-sans-serif,sans-serif">Atkinson Hyperlegible</button>
    </div>
    <div class="tome-group">
      <button class="tome-print" id="tome-print">Save as PDF</button>
      <button class="tome-send" id="tome-send">Send to Kindle</button>
    </div>
  </div>
</nav>
<div id="tome-send-status" role="status" aria-live="polite" hidden></div>

<div id="tome-status"></div>
<h1 class="article-title" id="tome-title"></h1>
<p class="article-meta" id="tome-meta"></p>
<article class="article-body" id="tome-content"></article>

<script src="reader.js"></script>
</body>
</html>
