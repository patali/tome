<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tome — Settings</title>
<link rel="icon" type="image/png" href="icons/icon48.png">
<style>
  :root { color-scheme: light dark; }
  body { max-width: 460px; margin: 0 auto; padding: 28px 20px 48px;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; color: #111; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #1c1c1e; } }
  h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
  h1 img { width: 26px; height: 26px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
    color: #888; margin: 28px 0 8px; }
  input[type=text], input[type=email], input[type=password] {
    display: block; width: 100%; box-sizing: border-box; margin: 8px 0 0;
    padding: 8px 10px; font: inherit; border: 1px solid #888; border-radius: 8px;
    background: inherit; color: inherit; }
  button { padding: 8px 14px; margin-top: 10px; font: inherit; font-weight: 600;
    cursor: pointer; border-radius: 8px; border: 1px solid #888; background: inherit; color: inherit; }
  .primary { background: #111; color: #fff; border-color: #111; }
  @media (prefers-color-scheme: dark) { .primary { background: #eee; color: #111; border-color: #eee; } }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row input { flex: 1; }
  .muted { color: #888; } .err { color: #d1342f; } .ok { color: #1a9e4b; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #bbb; margin-right: 5px; vertical-align: middle; }
  .dot.up { background: #1a9e4b; } .dot.down { background: #d1342f; }
  label.toggle { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
  label.toggle input { width: 16px; height: 16px; }
  #note { min-height: 20px; margin-top: 10px; }
  a { color: inherit; }
  .hrow { display: flex; gap: 10px; align-items: baseline; padding: 8px 0;
    border-top: 1px solid rgba(128,128,128,0.25); }
  .hrow .hstate { flex: none; width: 14px; text-align: center; }
  .hrow .hbody { flex: 1; min-width: 0; }
  .hrow .htitle { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .hmsg { font-size: 12px; color: #888; }
  .hrow.error .hmsg { color: #d1342f; }
  .hrow .hwhen { flex: none; font-size: 12px; color: #888; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> Tome settings</h1>
  <div id="server-line" class="muted"><span class="dot" id="dot"></span><span id="server-text">checking…</span></div>

  <h2>Server</h2>
  <div class="row">
    <input id="server-url" type="text" placeholder="http://localhost:8080" spellcheck="false" aria-label="Server URL">
    <button id="save-server">Save</button>
  </div>

  <h2>Account</h2>
  <div id="acct-signedin" hidden>
    <div id="acct-info"></div>
    <p class="muted" style="margin-bottom:0">Kindle address (where documents are sent)</p>
    <div class="row">
      <input id="kindle-edit" type="email" placeholder="you@kindle.com" spellcheck="false">
      <button id="save-kindle">Save</button>
    </div>
    <button id="signout">Sign out</button>
  </div>
  <div id="acct-signedout" hidden>
    <p class="muted">Redeem the invite you were sent:</p>
    <input id="invite-code" type="text" placeholder="Invite code (tomeinv_…)" spellcheck="false">
    <input id="acct-email" type="email" placeholder="Your email">
    <input id="acct-kindle" type="email" placeholder="you@kindle.com">
    <button id="redeem" class="primary">Redeem invite</button>
    <p class="muted">…or sign in with an existing API key:</p>
    <div class="row">
      <input id="api-key-input" type="password" placeholder="tome_…" spellcheck="false">
      <button id="save-key">Use key</button>
    </div>
  </div>
  <div id="acct-offline" class="muted" hidden>Server unreachable — check the URL above.</div>

  <h2>Popup buttons</h2>
  <p class="muted" style="margin:0">Style</p>
  <label class="toggle"><input type="radio" name="btn-style" id="style-text" value="text"> <b>Icon + text</b> (stacked buttons)</label>
  <label class="toggle"><input type="radio" name="btn-style" id="style-icons" value="icons"> <b>Icons only</b> (compact row)</label>
  <p class="muted" style="margin:12px 0 0">Visibility</p>
  <label class="toggle"><input type="checkbox" id="btn-preview"> Show <b>Open preview</b></label>
  <label class="toggle"><input type="checkbox" id="btn-kindle"> Show <b>Send to Kindle</b> (direct email delivery)</label>

  <h2>Version</h2>
  <div id="version-line" class="muted">Checking…</div>
  <div id="update-actions">
    <button id="check-update">Check for updates</button>
    <a id="update-guide" href="#" hidden>How to update</a>
  </div>

  <h2>Recent conversions</h2>
  <div id="history" class="muted">Loading…</div>
  <button id="clear-history" hidden>Clear history</button>

  <div id="note" class="muted"></div>
  <script src="settings.js"></script>
</body>
</html>
