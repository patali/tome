<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 260px; margin: 0; padding: 14px;
    font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; color: #111; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #1c1c1e; } }
  h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  h1 img { width: 20px; height: 20px; }
  button { display: block; width: 100%; margin: 0 0 8px; padding: 10px;
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; border: 1px solid #888; }
  .primary { background: #111; color: #fff; border-color: #111; }
  @media (prefers-color-scheme: dark) { .primary { background: #eee; color: #111; border-color: #eee; } }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #bbb; margin-right: 5px; vertical-align: middle; }
  .dot.up { background: #1a9e4b; } .dot.down { background: #d1342f; }
  .muted { color: #888; }
  .err { color: #d1342f; } .ok { color: #1a9e4b; }
  details { margin-top: 12px; font-size: 12px; }
  summary { cursor: pointer; color: #888; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row input, .stack input { flex: 1; min-width: 0; padding: 6px 8px; font: inherit;
    border: 1px solid #888; border-radius: 6px; background: inherit; color: inherit; }
  .row button { width: auto; margin: 0; padding: 6px 10px; font-weight: 600; }
  #settings-note { margin-top: 6px; min-height: 14px; }
  .stack input { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; }
  .stack button { margin-top: 8px; }
  .divider { margin: 12px 0 4px; color: #888; font-weight: 600; }
  #account a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> Tome</h1>
  <button id="reader" class="primary">Open reader tab</button>
  <button id="kindle">Send to Kindle</button>
  <div id="server"><span class="dot" id="dot"></span><span id="server-text" class="muted">checking server…</span></div>
  <div id="status"></div>
  <details id="settings">
    <summary>Server settings</summary>
    <div class="row">
      <input id="server-url" type="text" placeholder="http://localhost:8080"
             aria-label="Server URL" spellcheck="false">
      <button id="save-server">Save</button>
    </div>
    <div id="account">
      <div id="acct-signedout" hidden>
        <div class="divider">Account</div>
        <div class="stack">
          <input id="invite-code" placeholder="Invite code (tomeinv_…)" spellcheck="false">
          <input id="acct-email" type="email" placeholder="Your email">
          <input id="acct-kindle" type="email" placeholder="you@kindle.com">
          <button id="redeem" class="primary">Redeem invite</button>
        </div>
        <div class="row">
          <input id="api-key-input" type="password" placeholder="…or paste an API key" spellcheck="false">
          <button id="save-key">Use</button>
        </div>
      </div>
      <div id="acct-signedin" hidden>
        <div class="divider">Account</div>
        <div id="acct-info"></div>
        <div><a href="#" id="signout">Sign out</a></div>
      </div>
    </div>
    <div id="settings-note" class="muted"></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
