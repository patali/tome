<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 260px; margin: 0; padding: 14px;
    font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; color: #111; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #1c1c1e; } }
  h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  h1 img { width: 20px; height: 20px; }
  #gear { margin-left: auto; padding: 2px 6px; font-size: 15px; line-height: 1;
    background: none; border: none; cursor: pointer; border-radius: 6px; color: inherit; }
  #gear:hover { background: rgba(128,128,128,0.18); }
  button.action { display: block; width: 100%; margin: 0 0 8px; padding: 10px;
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; border: 1px solid #888;
    background: inherit; color: inherit; }
  button.action .ico { margin-right: 7px; }
  /* Icons-only mode: one compact row of square buttons (labels in tooltips). */
  body.icons-only #actions { display: flex; gap: 8px; }
  body.icons-only button.action { width: auto; flex: 1; margin: 0; padding: 10px 0; font-size: 19px; }
  body.icons-only button.action .ico { margin: 0; }
  body.icons-only button.action .label { display: none; }
  .primary { background: #111; color: #fff; border-color: #111; }
  @media (prefers-color-scheme: dark) { .primary { background: #eee; color: #111; border-color: #eee; } }
  button:disabled { opacity: 0.5; cursor: default; }
  #server { margin-top: 4px; }
  #status { margin-top: 8px; font-size: 12px; min-height: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #bbb; margin-right: 5px; vertical-align: middle; }
  .dot.up { background: #1a9e4b; } .dot.down { background: #d1342f; }
  .muted { color: #888; }
  .err { color: #d1342f; } .ok { color: #1a9e4b; }
  #setup-hint { margin: 2px 0 10px; }
  #setup-hint a { color: inherit; }
  #queue { margin-top: 10px; }
  #queue:empty { margin-top: 0; }
  .job { display: flex; gap: 7px; align-items: flex-start; padding: 7px 0;
    border-top: 1px solid rgba(128,128,128,0.25); font-size: 12px; }
  .job .jico { flex: none; line-height: 1.35; }
  .job .jbody { min-width: 0; }
  .job .jtitle { display: block; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 600; }
  .job .jmsg { display: block; color: #888; }
  .job.error .jmsg { color: #d1342f; white-space: normal; }
  .job.done .jmsg { color: #1a9e4b; }
  /* The running marker pulses so a stalled job is distinguishable from a
     finished one at a glance. */
  .job.running .jico { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .job.running .jico { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> Tome
    <button id="gear" title="Tome settings" aria-label="Tome settings">⚙</button>
  </h1>
  <div id="setup-hint" class="muted" hidden>Not connected — <a href="#" id="open-settings">open settings</a> to sign in.</div>
  <div id="actions">
    <button id="reader" class="action primary" title="Open preview">
      <span class="ico">📖</span><span class="label">Open preview</span></button>
    <button id="kindle" class="action" title="Send to Kindle">
      <span class="ico">📤</span><span class="label">Send to Kindle</span></button>
  </div>
  <div id="server"><span class="dot" id="dot"></span><span id="server-text" class="muted">checking server…</span></div>
  <div id="queue"></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
